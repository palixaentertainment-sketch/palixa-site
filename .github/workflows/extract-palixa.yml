name: Extract Palixa site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract site
        run: |
          mkdir -p /tmp/palixa
          unzip -o palixa-site.zip -d /tmp/palixa
          cp -R /tmp/palixa/. .
          rm -rf /tmp/palixa
          rm -f .github/workflows/extract-palixa.yml

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Palixa site files"
            git push
          fi
