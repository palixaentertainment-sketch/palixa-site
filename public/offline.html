<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>You're offline | Palixia</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #faf8ff; color: #24153d; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
      main { max-width: 360px; }
      .mark { width: 68px; height: 68px; margin: 0 auto 20px; border-radius: 22px; display: grid; place-items: center; background: #6d38c7; color: white; font-size: 32px; font-weight: 700; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 0 24px; line-height: 1.6; color: #665b76; }
      button { border: 0; border-radius: 999px; padding: 13px 22px; background: #6d38c7; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">P</div>
      <h1>You're offline</h1>
      <p>Palixia needs an internet connection to load your books and account. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
